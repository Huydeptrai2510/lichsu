<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Đông Nam Á trước làn sóng thực dân và con đường của Xiêm</title>
<meta name="description" content="Website trình chiếu lịch sử: xâm lược Đông Nam Á và công cuộc cải cách của Xiêm (Lịch sử 11).">
<meta name="theme-color" content="#0e0c0a">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Source+Sans+3:wght@400;600&display=swap">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="app">
  <div id="stage" role="region" aria-label="Trình chiếu lịch sử"></div>
  <div id="wipe"></div>
</div>
<div id="ui">
  <div id="progress" role="progressbar" aria-label="Tiến độ" aria-valuemin="0" aria-valuemax="100"><i></i></div>
  <div id="chapter"></div>
  <div id="count" aria-live="polite"></div>
  <button id="vctl" hidden>Bỏ qua video ›</button>
  <nav id="ctrl" aria-label="Điều khiển">
    <button id="prev" aria-label="Trang trước">‹</button>
    <button id="next" aria-label="Trang sau">›</button>
    <button id="menuBtn" aria-expanded="false">Mục lục</button>
    <button id="srcBtn">Nguồn</button>
    <button id="perfBtn" aria-pressed="false">Hiệu ứng nhẹ</button>
    <button id="fsBtn">Toàn màn hình</button>
  </nav>
  <button id="hideBtn" aria-label="Ẩn hoặc hiện giao diện điều khiển">Ẩn giao diện</button>
</div>
<aside id="panel" hidden></aside>
<aside id="menu" hidden></aside>
<pre id="debug" hidden></pre>
<div id="endp" hidden><p>Cảm ơn đã theo dõi.</p><button>Xem lại từ đầu</button></div>
<div id="loading">Đang chuẩn bị trình chiếu…</div>
<div id="err" hidden>Không thể khởi động trình chiếu. Hãy tải lại trang (Ctrl+Shift+D để xem chi tiết lỗi).</div>
<div id="rot">Xoay ngang màn hình để xem trình chiếu.</div>
<noscript><p style="padding:40px;color:#e9dfc8">Trang này cần bật JavaScript.</p></noscript>
<script src="https://cdn.jsdelivr.net/npm/appwrite@21.2.1"></script>
<script src="./app.js"></script>
</body>
</html>
